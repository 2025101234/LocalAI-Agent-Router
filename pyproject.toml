[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localai-agent-router"
version = "0.3.2"
description = "A pure-local multi-model AI Agent router platform"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "LocalAI Team"}
]
keywords = ["ai", "agent", "router", "llm", "cli", "web-ui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.31",
    "pyyaml>=6.0.1",
    "cryptography>=42.0.8",
    "loguru>=0.7.2",
    "pypdf>=4.3.1",
    "keyring>=25.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "respx>=0.21.1",
    "pytest-cov>=5.0.0",
]

[project.scripts]
localai = "main:main"
localai-gui = "gui.server:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "agents*", "cli*", "config*", "gui*", "localai_agent_router*", "models*", "providers*", "storage*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
config = ["*.yaml"]
gui = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
